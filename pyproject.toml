[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exelltech-remote-control"
version = "0.1.0"
description = "Python driver library for Exelltech ELT404(D)/ELT808(D)/ELT1616(D) audio DSP/matrix hardware"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "aktush"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/saktush/Exelltech_remote_control"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]
examples = ["python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exelltech_remote_control = ["py.typed"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["exelltech_remote_control"]
mypy_path = "src"
disallow_untyped_defs = true
